# Gitleaks config for Athena-Search
# https://github.com/gitleaks/gitleaks

title = "Athena-Search gitleaks config"

[allowlist]
  description = "Global allowlist"
  paths = [
    '''\.env\.example$''',
    '''server/\.env\.example$''',
    '''node_modules/''',
    '''package-lock\.json$''',
    '''\.git/''',
  ]
