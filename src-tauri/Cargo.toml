[package]
name = "athena-search"
version = "1.0.70"
description = "Athena Second Brain desktop & mobile wrapper"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
