name: anti-slop

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  anti-slop:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Anti-slop lint (stop-slop + no-ai-slop rules)
        run: |
          set -euo pipefail
          echo "Running stop-slop vocabulary check on PR diff + body"
          BODY_FILE="${RUNNER_TEMP}/pr-body.txt"
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.title + "\n" + .body' > "$BODY_FILE" 2>/dev/null || true
          DIFF_FILE="${RUNNER_TEMP}/pr.diff"
          # filter vendor bundles — they carry the vocabulary as documentation
          git diff "origin/${{ github.base_ref }}...HEAD" -- ':!.agents' ':!skills-lock.json' ':!package-lock.json' ':!scripts/anti-slop.sh' ':!AGENTS.md' ':!CLAUDE.md' ':!docs/security-audit.md' > "$DIFF_FILE" || true
          grep -E '^\+' "$DIFF_FILE" > "${DIFF_FILE}.added" || true
          DIFF_FILE="${DIFF_FILE}.added"
          SLOP_REGEX='(\bdelve\b|\bcrucial\b|\brobust\b|\bseamless\b|\bleverage\b|\btapestry\b|\bmeticulous(ly)?\b|\bunveil\b|\bembark\b|\bgame-changer\b|\bcutting-edge\b|\bstate-of-the-art\b|\bempower\b|\bsynergy\b|\bgranular\b|\bcomprehensive\b|\bholistic\b|\bbest-of-breed\b|\bstreamline\b|\binnovative\b|\bforward-thinking\b|\bin today.s fast-paced\b|\bin conclusion\b|\bit.s important to note\b|\bwhether you.re a seasoned\b|\bsupercharge\b|\bharness the power\b|\beffortlessly\b|\bdive into\b|\bdive deep\b|\belevate\b|\bunleash\b|\blet.s unlock\b|\bbeyond just\b|\bnot only\.\.\.but also\b)'
          FAIL=0
          for F in "$BODY_FILE" "$DIFF_FILE"; do
            [ -f "$F" ] || continue
            HITS=$(grep -i -E -n "$SLOP_REGEX" "$F" 2>/dev/null | grep -v 'SLOP_REGEX')
            if [ -n "$HITS" ]; then
              echo "$HITS" | head -n 50
              echo "::warning::Anti-slop hit in $F — rewrite with plain language (stop-slop skill) before merge."
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Anti-slop check found AI tells. Fix with: apply the 'stop-slop' skill to PR title/body and commit messages."
            exit 1
          fi
          echo "Anti-slop check passed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
