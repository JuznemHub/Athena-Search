name: check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:version

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write    # gitleaks comments findings on the PR
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # gitleaks scans history, not just the tip
          persist-credentials: false
      # pinned to the v3 commit — a mutable tag lets upstream change what runs here
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
