name: apply-clone-modes

on:
  push:
    branches: [feat/clean-clone-modes]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply clone command migration
        run: node tools/apply_clone_modes.mjs

      - name: Validate syntax
        run: node --check worker/index.js && node --check worker/clone_modes.js

      - name: Remove migration tooling and commit
        run: |
          rm -f tools/apply_clone_modes.mjs .github/workflows/apply-clone-modes.yml
          git config user.name "Athena Bot"
          git config user.email "athena-bot@users.noreply.github.com"
          git add worker/index.js worker/clone_modes.js
          git rm -f tools/apply_clone_modes.mjs .github/workflows/apply-clone-modes.yml
          git commit -m "feat(bot): split bot and userbot clone modes"
          git push
